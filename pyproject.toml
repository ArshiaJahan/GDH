[project]
name = "gamedevworkstation"
version = "0.5.1"
description = "Personal agent workstation: Claude orchestrator + Codex + ElevenLabs"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "openai>=1.100",
  "elevenlabs>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "ptyprocess>=0.7",
  "apscheduler>=3.10,<4",
  "mcp>=1.10",
  "keyring>=25",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pypdf>=4",
  "tomli-w>=1.0",
]

[project.scripts]
gamedevworkstation = "gamedevworkstation.__main__:main"
gdw = "gamedevworkstation.__main__:main"

[project.optional-dependencies]
agent-sdk = [
    "claude-agent-sdk>=0.2.178",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "pyinstaller>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/gamedevworkstation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real provider APIs (skipped without keys)",
           "auto_title: keep session auto-titling on (other tests turn it off)",
           "shipped_harness_default: new sessions get the shipped [sessions].default_harness (others pin builtin)"]
