name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python)
    # The backend is POSIX/macOS-only (process groups, PTYs, Keychain), like the app itself.
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies (including the optional Agent SDK extra)
        run: uv sync --frozen --all-extras
      - name: Run pytest
        # Live tests hit real provider APIs and skip themselves without keys.
        run: uv run --frozen pytest -q -p no:cacheprovider -m "not live"

  frontend:
    name: Frontend typecheck and tests
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Run vitest
        run: npx vitest run

  windows:
    name: Windows build (installer + backend smoke test)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Process helper tests on Windows
        shell: pwsh
        run: |
          uv sync --frozen --all-extras
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen pytest -q -p no:cacheprovider tests/test_procs.py tests/test_release_feed.py
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Smoke test the frozen backend
        shell: pwsh
        run: |
          $env:GDW_HOME = Join-Path $env:RUNNER_TEMP "gdw-home"
          $env:GDW_TOKEN = "ci"
          $log = Join-Path $env:RUNNER_TEMP "backend.log"
          $err = Join-Path $env:RUNNER_TEMP "backend.err"
          $p = Start-Process -FilePath "dist\backend\gamedevworkstation-backend.exe" `
            -ArgumentList "--port", "8765", "--no-browser" -PassThru -NoNewWindow `
            -RedirectStandardOutput $log -RedirectStandardError $err
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $ok = (Invoke-RestMethod http://127.0.0.1:8765/health).ok } catch { }
          }
          if (-not $ok) { Get-Content $log, $err; throw "The frozen backend didn't answer /health" }
          $h = @{ Authorization = "Bearer ci" }
          Invoke-RestMethod -Headers $h http://127.0.0.1:8765/api/sessions | Out-Null
          $s = Invoke-RestMethod -Headers $h -Method Post -ContentType "application/json" -Body "{}" http://127.0.0.1:8765/api/sessions
          Write-Host "Created session $($s.id); backend version $((Invoke-RestMethod http://127.0.0.1:8765/health).version)"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: GameDevWorkstation-windows-x64
          path: dist/*-setup.exe
          if-no-files-found: error
