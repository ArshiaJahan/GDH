name: GDH CI triage
description: Classify why a GitHub Actions run failed (rules only, no model key) and write a summary or PR comment.

inputs:
  run-id:
    description: ID of the failed workflow run to triage (digits).
    required: true
  repo:
    description: Repository that owns the run, as OWNER/NAME.
    default: ${{ github.repository }}
  comment-pr:
    description: Pull request number to comment on. Leave empty to only write the job summary.
    default: ''
  token:
    description: Token for reading run logs (actions read) and commenting (pull-requests write).
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
    - name: Triage the failed run
      shell: bash
      env:
        # Inputs reach the script only through env and are quoted; never interpolate them into the script.
        RUN_ID: ${{ inputs.run-id }}
        REPO: ${{ inputs.repo }}
        PR: ${{ inputs.comment-pr }}
        GH_TOKEN: ${{ inputs.token }}
        UV_PYTHON: "3.13"
      run: |
        set -euo pipefail
        if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
          echo "::error::run-id must be digits"; exit 1
        fi
        if ! [[ "$PR" =~ ^[0-9]*$ ]]; then
          echo "::error::comment-pr must be digits or empty"; exit 1
        fi
        # Run the CLI from this action's own checkout so other repos can use the action too.
        ACTION_ROOT="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        args=(triage "$RUN_ID" --repo "$REPO" --summary)
        if [ -n "$PR" ]; then
          args+=(--comment "$PR")
        fi
        # --frozen installs exactly what uv.lock pins (this step has GH_TOKEN in its env); triage needs no extras.
        uv run --frozen --no-dev --project "$ACTION_ROOT" gdw "${args[@]}"
