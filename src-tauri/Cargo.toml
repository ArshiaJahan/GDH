[package]
name = "gamedevworkstation-app"
version = "0.5.1"
description = "GameDevWorkstation: personal agent harness"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gamedevworkstation_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Plain-HTTP client (no TLS) for streaming downloads from the local backend to a user-chosen file.
ureq = { version = "2", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
